name: Variance schedule tests

on:
  push:
    paths:
      - "tools/variance_schedule/**"
      - "python-nanobind/**"
      - "ql/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/variance-schedule.yml"
  pull_request:
    paths:
      - "tools/variance_schedule/**"
      - "python-nanobind/**"
      - "ql/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/variance-schedule.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-dev
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core ninja pytest
          python -m pip install -r tools/variance_schedule/intraday-requirements.txt

      - name: Build and install qlnb
        working-directory: python-nanobind
        run: python -m pip install --no-build-isolation .

      - name: Run variance schedule tests
        run: python -m pytest -q tools/variance_schedule
