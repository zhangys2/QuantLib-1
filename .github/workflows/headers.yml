name: Compile single headers
on:
  push:
    branches:
      - master
      - cursor/nanobind-python-phase186-clean
    paths-ignore:
      - 'python-nanobind/**'
      - '.github/workflows/qlnb-wheels.yml'
  pull_request:
    paths-ignore:
      - 'python-nanobind/**'
      - '.github/workflows/qlnb-wheels.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt update
        sudo apt install -y libboost-dev ccache
    - name: Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: single-headers-${{ github.ref }}
        restore-keys: |
          single-headers-${{ github.ref }}
          single-headers-refs/heads/master
          single-headers-
    - name: Check
      env:
        CXX: ccache g++
      run: |
        ./tools/check_all_headers.sh
