name: Check doc generation
on:
  push:
    branches:
      - master
      - cursor/nanobind-python-phase186-clean
    paths-ignore:
      - 'python-nanobind/**'
      - '.github/workflows/qlnb-wheels.yml'
  pull_request:
    paths-ignore:
      - 'python-nanobind/**'
      - '.github/workflows/qlnb-wheels.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  docs:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      run: |
        brew install automake autoconf libtool boost doxygen graphviz
        ./autogen.sh
        ./configure --with-boost-include=$(brew --prefix)/include
    - name: Doxygen version
      run: |
        doxygen --version
    - name: Check
      run: |
        make docs

  header-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check
      run: |
        ./tools/check_all_header_docs.sh
